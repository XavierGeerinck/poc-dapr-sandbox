# Path (d): no warm pool and no template; each activation boots a VM from
# the image (acquirePath BOOT).
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: py-boot
spec:
  type: sandbox.microvm
  version: v1
  metadata:
  - name: image
    value: python:3.12-slim
  - name: warmPoolSize
    value: "0"
  - name: template
    value: none
  # Cgroup migration waits an RCU grace period after idle; favordynmods avoids it.
  - name: setup
    value: mount -o remount,favordynmods /sys/fs/cgroup
