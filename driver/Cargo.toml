[package]
name = "dapr-sandbox-microvm"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Dapr sandbox driver (pluggable component) that hosts microVMs"
license = "Apache-2.0"
publish = false

[lib]
name = "dapr_sandbox_microvm"
path = "src/lib.rs"

[[bin]]
name = "dapr-sandbox-microvm"
path = "src/main.rs"

[features]
default = ["microsandbox"]
# Gates the real microsandbox backend. Empty until Task 11 adds the optional
# `microsandbox` dependency; until then every build serves the FakeBackend.
microsandbox = []

[dependencies]
async-trait = "0.1.89"
prost = "0.14.1"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
tokio-util = { version = "0.7.17", features = ["rt"] }
tonic = "0.14.2"
tonic-prost = "0.14.2"
tonic-reflection = "0.14.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[build-dependencies]
prost-build = "0.14.1"
tonic-prost-build = "0.14.2"

[dev-dependencies]
hyper-util = { version = "0.1.17", features = ["tokio"] }
regex = "1.12.2"
tempfile = "3.23.0"
tower = { version = "0.5.2", features = ["util"] }
